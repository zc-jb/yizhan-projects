server:
  port: 8100
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: campus-system

  # MySQL：createDatabaseIfNotExist 保证首次启动自动建库
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/campus_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  # 由 JPA 自动建表；演示数据由 DataSeeder 在表为空时写入
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Redis 不可用时不影响启动：CacheService 内部自动降级为进程内缓存
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 500ms
      connect-timeout: 500ms
      lettuce:
        shutdown-timeout: 100ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

logging:
  level:
    root: info
    com.campus: info

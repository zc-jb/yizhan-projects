<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服工作台 · 技术驿站</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧑‍💼</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1117;--card:#171b26;--line:#262c3d;--txt:#e6e8ee;--dim:#9aa1b2;--blue:#4d9fff;--purple:#8b5cf6;--green:#2ecc71;--red:#e5484d;--gold:#f5b942}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:20px;min-height:100vh}
.wrap{max-width:1160px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:22px;font-weight:800;letter-spacing:.5px}
.tag{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.spacer{flex:1}
.tk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--txt);font-size:13px;width:220px;outline:none;font-family:inherit}
.tk:focus{border-color:var(--blue)}
.btn{background:linear-gradient(120deg,#1e6fff,#8b5cf6);border:none;color:#fff;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--dim);font-weight:600}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--dim);display:block;margin-top:6px}
.stat i{font-size:11px;color:var(--dim);font-style:normal;display:block;margin-top:4px;opacity:.8}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h2{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel h2 em{font-style:normal;font-size:11px;color:var(--dim);font-weight:400}
.cols{grid-template-columns:1.25fr 1fr;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--txt);font-size:14px;outline:none;font-family:inherit}
.field input:focus,.field select:focus{border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{font-size:13px;line-height:1.7;margin-top:10px;word-break:break-all}
.msg.ok{color:var(--green)} .msg.err{color:var(--red)}
.codebox{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px dashed var(--blue);border-radius:10px;padding:12px 14px;margin-top:10px}
.codebox b{font-size:19px;letter-spacing:1.5px;color:var(--blue);font-variant-numeric:tabular-nums;flex:1}
.mini{border:1px solid var(--blue);background:none;color:var(--blue);border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit}
.charts{grid-template-columns:1fr 1fr;margin-top:0;margin-bottom:18px}
.bars{display:flex;align-items:flex-end;gap:8px;height:96px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bar u{display:block;width:100%;background:linear-gradient(180deg,var(--blue),rgba(77,159,255,.35));border-radius:6px 6px 2px 2px;min-height:2px;text-decoration:none}
.bar u.p{background:linear-gradient(180deg,var(--purple),rgba(139,92,246,.35))}
.bar s{font-size:10px;color:var(--dim);text-decoration:none}
.list{display:flex;flex-direction:column;gap:8px;max-height:330px;overflow:auto}
.item{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13px}
.item b{font-family:ui-monospace,Consolas,monospace;color:var(--blue);letter-spacing:.5px}
.item span{flex:1;color:var(--dim);font-size:12px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--dim)}
.pill.on{color:var(--green);border-color:rgba(46,204,113,.4)}
.pill.off{color:var(--gold);border-color:rgba(245,185,66,.35)}
.user{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
.user .top{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.user .top span{font-size:11px;color:var(--dim);font-weight:400}
.user .ents{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.ent{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--dim)}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:18px 0}
.stat{position:relative}
.stat.click{cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.stat.click:hover{border-color:var(--blue);transform:translateY(-2px)}
.stat .more{position:absolute;right:12px;bottom:9px;font-size:10px;color:var(--dim);font-style:normal}
.stat.click:hover .more{color:var(--blue)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:99;padding:18px}
.modal.on{display:flex}
.modal-box{background:var(--card);border:1px solid var(--line);border-radius:14px;width:min(880px,96vw);max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
.modal-box header{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--line);margin:0}
.modal-box h3{margin:0;font-size:15px}
.modal-box header button{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;line-height:1}
.modal-box header button:hover{color:var(--txt)}
.modal-body{overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{position:sticky;top:0;background:var(--card);color:var(--dim);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 14px;border-bottom:1px dashed var(--line);color:var(--txt);vertical-align:top}
.tbl td:first-child{white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl .mono{font-family:ui-monospace,Consolas,monospace;color:var(--blue);letter-spacing:.4px}
footer{text-align:center;color:var(--dim);font-size:12px;margin-top:22px}
footer a{color:var(--blue);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧑‍💼 客服工作台</h1>
    <span class="tag" id="envTag">未连接</span>
    <div class="spacer"></div>
    <input class="tk" id="tk" type="password" placeholder="站长口令 ADMIN_TOKEN" autocomplete="off">
    <button class="btn" id="login">连接</button>
    <button class="btn ghost" id="refresh">刷新数据</button>
  </header>

  <div class="grid stats" id="stats"></div>

  <div class="grid charts">
    <div class="panel">
      <h2>近 7 天注册 <em>人数</em></h2>
      <div class="bars" id="bar1"></div>
    </div>
    <div class="panel">
      <h2>近 7 天兑换 <em>张数</em></h2>
      <div class="bars" id="bar2"></div>
    </div>
  </div>

  <div class="grid cols">
    <div class="grid" style="gap:14px">
      <div class="panel">
        <h2>发放开通码 <em>用户付款后在此生成，仅该账号可用一次</em></h2>
        <div class="field"><label>用户账号（须已注册）</label><input id="acc" placeholder="输入完整账号，区分大小写" autocomplete="off"></div>
        <div class="row2">
          <div class="field"><label>套餐</label>
            <select id="plan">
              <option value="6">单次 · ¥6</option>
              <option value="18" selected>包周 · ¥18.88</option>
              <option value="59">包月 · ¥59.99</option>
              <option value="666">包年 · ¥666</option>
            </select>
          </div>
          <div class="field"><label>确认账号</label><input id="acc2" placeholder="再输入一次防手误" autocomplete="off"></div>
        </div>
        <button class="btn" id="gen" style="width:100%">生成专属开通码</button>
        <div id="out"></div>
      </div>

      <div class="panel">
        <h2>账号查询 <em>支持模糊搜索</em></h2>
        <div class="field"><input id="q" placeholder="输入账号关键字，回车查询" autocomplete="off"></div>
        <div id="users"></div>
      </div>
    </div>

    <div class="grid" style="gap:14px">
      <div class="panel">
        <h2>最近发放 <em>8 条</em></h2>
        <div class="list" id="issued"></div>
      </div>
      <div class="panel">
        <h2>最近兑换 <em>8 条</em></h2>
        <div class="list" id="redeemed"></div>
      </div>
      <div class="panel">
        <h2>套餐分布 <em>已兑换</em></h2>
        <div class="list" id="byplan"></div>
      </div>
    </div>
  </div>

  <footer>技术驿站 · 客服后台 · <a href="./">返回前台</a></footer>
</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <header><h3 id="mTitle">明细</h3><button id="mClose" title="关闭">✕</button></header>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const PLAN = { free: '免费', once: '单次', week: '包周', month: '包月', year: '包年' };
const KEY = 'yz-admin-token';
let token = localStorage.getItem(KEY) || '';
let timer = null;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '¥' + Number(n || 0).toFixed(2);
const day = s => {
  if (!s) return '-';
  const d = new Date(s);
  if (Number.isNaN(d.getTime())) return String(s);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

async function api(path, opt = {}) {
  const r = await fetch(path, {
    method: opt.method || 'GET',
    headers: { 'Content-Type': 'application/json', 'X-Admin-Token': token },
    body: opt.body ? JSON.stringify(opt.body) : undefined,
  });
  const d = await r.json().catch(() => ({})).then(x => x || {});
  if (!r.ok) {
    const err = new Error(d.error || ('请求失败 HTTP ' + r.status));
    err.status = r.status;
    throw err;
  }
  return d;
}

function setEnv(text, ok) {
  const el = $('#envTag');
  el.textContent = text;
  el.style.color = ok ? 'var(--green)' : 'var(--gold)';
  el.style.borderColor = ok ? 'rgba(46,204,113,.4)' : 'rgba(245,185,66,.35)';
}

function statCard(label, value, sub, type) {
  return `<div class="stat${type ? ' click' : ''}"${type ? ` data-type="${type}" data-title="${label}"` : ''}>
    <b>${value}</b><span>${label}</span>${sub ? `<i>${sub}</i>` : ''}
    ${type ? '<em class="more">查看明细 ›</em>' : ''}
  </div>`;
}

function drawBars(el, data, cls) {
  const max = Math.max(1, ...data.map(x => x.v));
  el.innerHTML = data.map(x => `
    <div class="bar" title="${x.d}：${x.v}">
      <u class="${cls}" style="height:${Math.round((x.v / max) * 100)}%"></u>
      <s>${x.d}</s>
    </div>`).join('');
}

let pollBusy = false;
async function loadStats() {
  if (pollBusy) return;
  pollBusy = true;
  try { await renderStats(); } finally { pollBusy = false; }
}

async function renderStats() {
  const d = await api('/api/admin/stats');
  const c = d.codes, u = d.users;
  $('#stats').innerHTML = [
    statCard('总用户', u.total, `正式 ${u.regular} · 游客 ${u.guest}`, 'users'),
    statCard('今日注册', u.today, `近 7 天 ${u.week}`, 'users_today'),
    statCard('留言总数', d.comments.total, `今日 ${d.comments.today}`, 'comments'),
    statCard('已发码', c.issued, `今日 ${c.issuedToday} · 未兑换 ${c.unused}`, 'issued'),
    statCard('已兑换', c.redeemed, `今日 ${c.redeemedToday}`, 'redeemed'),
    statCard('有效权益', c.active, '在线可用的开通用户'),
    statCard('累计收入', money(c.revenue), '按已兑换套餐估算'),
  ].join('');

  drawBars($('#bar1'), d.series.map(x => ({ d: x.d.slice(5), v: x.users })), '');
  drawBars($('#bar2'), d.series.map(x => ({ d: x.d.slice(5), v: x.redeemed })), 'p');

  $('#issued').innerHTML = d.recentIssued.length ? d.recentIssued.map(r => `
    <div class="item">
      <b>${esc(r.code)}</b>
      <span>${esc(r.username)} · ${PLAN[r.plan] || r.plan} · ${day(r.issued_at)}</span>
      <span class="pill ${r.used ? 'on' : 'off'}">${r.used ? '已兑换' : '待兑换'}</span>
    </div>`).join('') : '<div class="empty">暂无发放记录</div>';

  $('#redeemed').innerHTML = d.recentRedeemed.length ? d.recentRedeemed.map(r => `
    <div class="item">
      <b>${esc(r.code)}</b>
      <span>${esc(r.username)} · ${PLAN[r.plan] || r.plan} · ${day(r.used_at)}</span>
    </div>`).join('') : '<div class="empty">暂无兑换记录</div>';

  $('#byplan').innerHTML = d.byPlan.length ? d.byPlan.map(r => `
    <div class="item">
      <span style="flex:1;text-align:left;color:var(--txt)">${esc(r.label)}</span>
      <span>${r.n} 张 · ${money(r.amount)}</span>
    </div>`).join('') : '<div class="empty">暂无数据</div>';
}

function connect() {
  token = $('#tk').value.trim() || token;
  if (!token) { setEnv('请填写站长口令', false); return; }
  $('#login').disabled = true;
  loadStats()
    .then(() => {
      localStorage.setItem(KEY, token);
      setEnv('已连接（' + location.host + '）', true);
      if (timer) clearInterval(timer);
      timer = setInterval(() => loadStats().catch(() => {}), 3000);
    })
    .catch(e => {
      setEnv(e.message, false);
      if (e.status === 401) localStorage.removeItem(KEY);
    })
    .finally(() => { $('#login').disabled = false; });
}

$('#login').onclick = connect;
$('#refresh').onclick = () => loadStats().catch(e => setEnv(e.message, false));

$('#tk').value = token;
if (token) connect();

/* ---- 发放开通码 ---- */
$('#gen').onclick = async () => {
  const username = $('#acc').value.trim();
  const again = $('#acc2').value.trim();
  const plan = $('#plan').value;
  const out = $('#out');
  out.innerHTML = '';
  if (!username) return (out.innerHTML = '<p class="msg err">请输入用户账号</p>');
  if (username !== again) return (out.innerHTML = '<p class="msg err">两次输入的账号不一致，请核对</p>');

  const btn = $('#gen');
  btn.disabled = true;
  btn.textContent = '生成中…';
  try {
    const d = await api('/api/admin/codes', { method: 'POST', body: { username, plan } });
    out.innerHTML = `
      <div class="codebox"><b>${esc(d.code)}</b><button class="mini" id="copy">复制</button></div>
      <p class="msg ok">已生成：${esc(d.username)} · ${PLAN[d.plan] || d.plan}，仅该账号可用，且只能用一次。</p>`;
    $('#copy').onclick = () => {
      const done = () => { $('#copy').textContent = '已复制 ✓'; setTimeout(() => $('#copy').textContent = '复制', 1500); };
      try { navigator.clipboard.writeText(d.code).then(done).catch(done); } catch (_) { done(); }
    };
    $('#acc2').value = '';
    searchUsers(username);
    loadStats().catch(() => {});
  } catch (e) {
    out.innerHTML = `<p class="msg err">${esc(e.message)}</p>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '生成专属开通码';
  }
};

/* ---- 账号查询 ---- */
async function searchUsers(q) {
  const box = $('#users');
  if (!q) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="empty">查询中…</div>';
  try {
    const d = await api('/api/admin/users?q=' + encodeURIComponent(q));
    if (!d.users.length) { box.innerHTML = '<div class="empty">没有匹配的账号</div>'; return; }
    box.innerHTML = d.users.map(u => {
      const ents = u.entitlements.length
        ? u.entitlements.map(e => {
            const tag = e.plan === 'once'
              ? (Number(e.remaining) > 0 ? `${e.remaining} 次` : '已用完')
              : e.plan === 'free'
                ? '永久免费'
                : (e.expires_at ? '到期 ' + day(e.expires_at) : '长期');
            return `<span class="ent">${esc(e.work_key)} · ${PLAN[e.plan] || e.plan} · ${esc(tag)}</span>`;
          }).join('')
        : '<span class="ent">无开通记录</span>';
      return `<div class="user">
        <div class="top">${esc(u.username)} <span>注册 ${day(u.created_at)} · 已发 ${u.issued} 张 · 已兑换 ${u.redeemed} 张${u.guest ? ' · 游客' : ''}</span></div>
        <div class="ents">${ents}</div>
      </div>`;
    }).join('');
  } catch (e) {
    box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') searchUsers(e.target.value.trim()); });
$('#acc').addEventListener('change', e => {
  const v = e.target.value.trim();
  if (v.length >= 2) searchUsers(v);
});

/* ---- 统计卡片下钻 ---- */
const USER_TPL = {
  head: ['账号', '类型', '注册时间', '已兑换'],
  row: r => [esc(r.username), r.is_guest ? '游客' : '正式', day(r.created_at), r.redeemed + ' 张'],
};
const LIST_TPL = {
  users: USER_TPL,
  users_today: USER_TPL,
  comments: {
    head: ['账号', '内容', '位置', '时间'],
    row: r => [esc(r.username), esc(r.body), r.scope === 'guest' ? '留言板' : esc(r.slug), day(r.created_at)],
  },
  issued: {
    head: ['开通码', '账号', '套餐', '发放时间', '状态'],
    row: r => [
      `<span class="mono">${esc(r.code)}</span>`,
      esc(r.username),
      PLAN[r.plan] || r.plan,
      day(r.issued_at),
      r.used_at ? `<span class="pill on">已兑换 ${day(r.used_at)}</span>` : '<span class="pill off">待兑换</span>',
    ],
  },
  redeemed: {
    head: ['开通码', '账号', '套餐', '兑换时间'],
    row: r => [`<span class="mono">${esc(r.code)}</span>`, esc(r.username), PLAN[r.plan] || r.plan, day(r.used_at)],
  },
};

async function openList(type, title) {
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = '<div class="empty">加载中…</div>';
  $('#modal').classList.add('on');
  try {
    const d = await api('/api/admin/list?type=' + type);
    $('#mTitle').textContent = `${title}（共 ${d.total} 条）`;
    if (!d.rows || !d.rows.length) {
      $('#mBody').innerHTML = '<div class="empty">暂无数据</div>';
      return;
    }
    const t = LIST_TPL[type] || USER_TPL;
    $('#mBody').innerHTML =
      `<table class="tbl"><thead><tr>${t.head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
       <tbody>${d.rows.map(r => `<tr>${t.row(r).map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>` +
      (d.total > d.rows.length ? `<div class="empty">仅显示最近 ${d.rows.length} 条</div>` : '');
  } catch (e) {
    $('#mBody').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

$('#stats').addEventListener('click', e => {
  const card = e.target.closest('.stat.click');
  if (card) openList(card.dataset.type, card.dataset.title);
});
const closeModal = () => $('#modal').classList.remove('on');
$('#mClose').onclick = closeModal;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

</script>
</body>
</html>

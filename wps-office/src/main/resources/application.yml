server:
  port: 8400
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: wps-office

  # 内置 H2 文件数据库，双击即可运行，无需安装 MySQL
  # 数据文件位置：%USERPROFILE%\.wps-office\wpsdb.mv.db
  datasource:
    url: jdbc:h2:file:${user.home}/.wps-office/wpsdb;MODE=MySQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

logging:
  level:
    root: info
    com.wps: info
  file:
    name: ${user.home}/.wps-office/app.log

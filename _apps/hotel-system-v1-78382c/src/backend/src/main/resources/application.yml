server:
  port: 8080

spring:
  application:
    name: hotel-system
  datasource:
    url: jdbc:mysql://${HOTEL_DB_HOST:127.0.0.1}:${HOTEL_DB_PORT:3306}/${HOTEL_DB_NAME:hotel_db}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${HOTEL_DB_USER:root}
    password: ${HOTEL_DB_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  cache:
    # 默认本地缓存，安装 Redis 后可用 --spring.profiles.active=redis 切换
    type: ${HOTEL_CACHE_TYPE:simple}
  data:
    redis:
      host: ${HOTEL_REDIS_HOST:127.0.0.1}
      port: ${HOTEL_REDIS_PORT:6379}
      timeout: 2s

app:
  jwt:
    secret: ${HOTEL_JWT_SECRET:hotel-system-demo-secret-key-please-change-in-production-2026}
    hours: 12

logging:
  level:
    root: info

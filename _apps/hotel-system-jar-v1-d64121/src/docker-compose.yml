services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hotel_db
    ports:
      - "33062:3306"
  app:
    build: .
    ports:
      - "8090:8080"
    depends_on:
      - db
    environment:
      HOTEL_DB_HOST: db
      HOTEL_DB_PORT: "3306"
      HOTEL_DB_NAME: hotel_db
      HOTEL_DB_USER: root
      HOTEL_DB_PASS: root

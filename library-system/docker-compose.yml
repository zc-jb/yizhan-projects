services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: library123
      MYSQL_DATABASE: library_db
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      LIB_DB_HOST: mysql
      LIB_DB_PORT: 3306
      LIB_DB_NAME: library_db
      LIB_DB_USER: root
      LIB_DB_PASS: library123
    depends_on:
      - mysql

volumes:
  mysql-data:
